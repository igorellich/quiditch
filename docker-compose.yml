services:
  server:
    build: 
      context: ./
      dockerfile: ./server/Dockerfile
    ports:
      - "3000:3000"
      - "9229:9229"
    volumes:
      - ./server/src:/app/server/src
      - ./common:/app/common  
    # networks:
    #   - app-network   
  
    command: npm run start:debug
  client:
    build: 
      context: ./
      dockerfile: ./client/Dockerfile
    ports:
      - "5173:5173"
      - "9230:9229"
    depends_on:
      - server
      
    environment:
      - SERVER_URL=http://server:3000  # Use service name as hostname
   
    volumes:
      - ./client/src:/app/client/src
      - ./common:/app/common      

    # networks:
    #   - app-network
  
    command: npm run dev

# networks:
#   app-network:
#     driver: bridge
